# Serves the built web app. A reverse proxy in front strips any sub-path
# (e.g. /datanorge/) before forwarding here.
server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets never change, so cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
