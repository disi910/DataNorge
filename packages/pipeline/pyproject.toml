[project]
name = "datasenter-pipeline"
version = "0.1.0"
description = "Fetchers, parsers, AI extractors, loaders for Datasenter-Norge"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5.3",
  "sqlalchemy>=2.0",
  "geoalchemy2>=0.15",
  "psycopg[binary]>=3.2",
  "shapely>=2.0",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "loguru>=0.7",
  "typer>=0.13",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
ai = [
  "anthropic>=0.40",
]
scrape = [
  "playwright>=1.48",
]
dev = [
  "pytest>=8.3",
  "ruff>=0.7",
]

[project.scripts]
pipeline = "pipeline.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["pipeline*"]

[tool.ruff]
line-length = 100
target-version = "py312"
